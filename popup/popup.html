<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Freedium</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <img
          class="header__logo"
          src="../icons/icon48.png"
          width="36"
          height="36"
          alt=""
        />
        <div class="header__text">
          <h1 class="header__title">Open in Freedium</h1>
          <p class="header__version">Version <span id="version">–</span></p>
        </div>
      </header>

      <p class="blurb">
        Open any Medium article on Freedium: click the green button on an
        article page, or the Freedium icon on a feed card.
      </p>

      <button type="button" id="whats-new" class="action">
        What's New
      </button>

      <nav class="links">
        <a
          class="links__item"
          href="https://github.com/therohanparmar/medium-to-freedium"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <a
          class="links__item"
          href="https://github.com/therohanparmar/medium-to-freedium/blob/main/PRIVACY.md"
          target="_blank"
          rel="noopener noreferrer"
          >Privacy</a
        >
      </nav>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
